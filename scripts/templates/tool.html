<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{META}}">
<link rel="canonical" href="{{CANON}}">
{{ALT}}
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{META}}">
<link rel="stylesheet" href="/shared/style.css">
</head>
<body data-tool="{{ID}}">
<!--SITE_HEADER-->
<span class="lang">{{SWITCH}}</span>
<p><a href="{{TOP}}">← {{TOPLABEL}}</a></p>
<h1 data-i18n="{{NAME_KEY}}">{{NAME}}</h1>
<p data-i18n="{{DESC_KEY}}">{{DESC}}</p>
<p class="note" data-i18n="{{PRICE_KEY}}">{{PRICE}}</p>
<div id="keybox"></div>
{{INPUTS}}
{{MARKETS}}
{{COUNT}}
<button id="run" data-i18n="ui.run">{{RUN}}</button>
<button id="sample" class="sub" data-i18n="ui.sample">{{SAMPLE}}</button>
{{SLOW}}
<p id="msg"></p>
<div id="answer"></div>
<div id="result"></div>
<p id="meta" class="note"></p>
<button id="csv" class="sub" data-i18n="ui.csv" hidden>{{CSV}}</button>
<button id="copy" class="sub" data-i18n="ui.copy" hidden>{{COPY}}</button>
<span id="copy-msg" class="note" role="status"></span>
<div id="ai-box" hidden></div>
{{CONTENT}}
<!--SITE_FOOTER-->
<script type="module" src="/shared/tool.js"></script>
</body>
</html>
